name: larkrelay

services:
  larkrelay:
    container_name: larkrelay
    # 按 RELAY_VERSION 打标签（而非固定名）：换 release 目录后单独 `up -d`（不 build）
    # 就能精确回滚到某个 sha 的旧镜像，不会被最新一次 build 覆盖
    image: "larkrelay:${RELAY_VERSION:-dev}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # 日志封顶：json-file 默认无上限，长期跑下去就是它把磁盘填满
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    ports:
      - "127.0.0.1:8310:8310"
    volumes:
      - /data/larkrelay:/data/larkrelay
    environment:
      - RELAY_CONFIG=/data/larkrelay/config/config.json
      - RELAY_SECRETS=/data/larkrelay/config/secrets.json
      - RELAY_LIVE=1
      - RELAY_VERSION=${RELAY_VERSION:-dev}
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8310/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
